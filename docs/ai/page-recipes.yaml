version: 1
updatedAt: "2026-05-08"
project: partime-boats

formTemplateDecisionMatrix:
  defaultRule: 优先使用基础表单；满足升级条件才进入分步或高级表单。
  chooseBasicFormWhen:
    - 字段数量 <= 12
    - 业务流程单阶段完成，不依赖前一步结果
    - 校验规则中低复杂度（跨字段联动 <= 2 组）
  chooseStepFormWhen:
    - 字段数量 > 12 且自然分为 2-5 个业务阶段
    - 后续步骤依赖前序步骤产物（例如先选主体再配规则）
    - 希望减少一次性输入压力，提升完成率
  chooseAdvancedFormWhen:
    - 存在动态字段块（增删行、嵌套结构、多段条件组）
    - 需要复杂联动或批量编辑能力
    - 单页可视化编排效率明显高于分步体验
    - 包含权限树勾选、半选或树节点联动回填
  advancedFormGuardrail:
    - 第一阶段默认不抽取 AdvancedFormRecipe
    - 未满足至少 3 个稳定样本前，按 business override 处理
    - 复用目标优先落在字段块与局部能力组件，避免过早抽整页骨架
  antiPatterns:
    - 仅因为“看起来高级”就选择高级表单
    - 仅因为字段多就直接上高级表单，忽略分步可读性
    - 未满足分步条件却拆成过多步骤

recipes:
  - id: list-query-standard
    name: 标准查询列表页
    appliesTo:
      - 运营列表
      - 规则列表
      - 资源列表
    routePattern: /dev/list/<feature>
    chooseTemplate: src/pages/templates/list/table-query-page.tsx
    requiredPieces:
      - src/shared/template-kit/specs/standard-list-page-spec.ts
      - src/shared/template-kit/recipes/standard-list-page-recipe.tsx
      - src/shared/template-kit/list/use-template-list-controller.ts
      - src/shared/template-kit/list/template-list-filter-form.tsx
      - src/shared/template-kit/list/template-list-content.tsx
      - src/shared/hooks/use-standard-pagination.ts
      - src/pages/templates/list/api.ts
    optionalPieces:
      - src/shared/components/query-state-block.tsx
    buildSteps:
      - 先确认是否满足 docs/ai/page-guardrail-recipes.md 的标准列表页接入条件
      - 页面通过 StandardListPageSpec 接入 StandardListPageRecipe，禁止直接散装拼装 controller 与状态区
      - 在 routes.config.ts 增加 route，绑定 permission=list.read 或业务权限
      - 定义 api.ts 中的 filters、response contract、fetch 函数
      - 用控制器串联 filter + table + pagination
      - 处理 partial/empty/error 展示
      - 补测试（控制器 + 页面渲染）

  - id: form-three-mode
    name: 三态表单页（add/modify/readonly）
    appliesTo:
      - 创建与编辑共用页面
      - 只读详情复用同一表单结构
    routePattern: /dev/form/<feature>?mode=add|modify|readonly&id=<resourceKey>
    chooseTemplate: src/pages/templates/form/basic-form-page.tsx
    requiredPieces:
      - src/routes/form-route-contract.ts
      - src/shared/template-kit/specs/basic-crud-form-spec.ts
      - src/shared/template-kit/recipes/basic-crud-form-recipe.tsx
      - src/shared/template-kit/form/use-template-form-controller.ts
      - src/shared/template-kit/form/template-form-state-gate.tsx
      - src/pages/templates/form/api.ts
    buildSteps:
      - 先确认是否满足 docs/ai/page-guardrail-recipes.md 的基础表单接入条件
      - 页面通过 BasicCrudFormSpec 接入 BasicCrudFormRecipe，禁止页面内重复手写固定底部操作条与基础错误态
      - 解析 mode/resourceKey，非法参数直接展示错误态
      - add 模式走 create，modify 模式走 fetch + update，readonly 禁用提交
      - 提交成功后统一反馈并可跳转结果页
      - 补测试（mode 解析、controller 行为、页面交互）

  - id: form-as-detail-default
    name: 默认表单复用详情页
    appliesTo:
      - 新增后查看详情
      - 列表点击查看记录详情
    routePattern: /dev/form/<feature>?mode=readonly&id=<resourceKey>
    chooseTemplate: src/pages/templates/form/basic-form-page.tsx
    principle:
      - 默认复用表单 readonly 模式，不单独创建详情页
      - 只有在业务确认“展示结构与编辑结构完全不同”时，才新建 profile/detail 页面
    specialCaseChecklist:
      - 是否需要大量只读聚合信息（非表单字段）？
      - 是否需要专门的时间轴、审批流、审计轨迹展示？
      - 是否需要双栏/多卡片布局且与编辑结构完全不同？
    buildSteps:
      - 列表“查看”按钮统一跳转 readonly form 路由
      - 若命中特例清单，先评审再落地独立详情页

  - id: form-step-standard
    name: 分步表单页
    appliesTo:
      - 多阶段录入
      - 后续步骤依赖前一步确认结果
    routePattern: /dev/form/<feature-step>
    chooseTemplate: src/pages/templates/form/step-form-page.tsx
    requiredPieces:
      - src/shared/template-kit/specs/step-form-spec.ts
      - src/shared/template-kit/recipes/step-form-recipe.tsx
    buildSteps:
      - 先确认是否满足 docs/ai/page-guardrail-recipes.md 的分步表单接入条件
      - 页面通过 StepFormSpec 接入 StepFormRecipe，禁止页面内重复手写页头、步骤条和阶段操作区
      - 业务页自行保留步骤状态机与步骤前校验逻辑
      - 完成态与说明区通过 spec slot 承载
      - 补测试（步骤切换、回退、完成态）

  - id: result-feedback-page
    name: 结果反馈页（成功/失败）
    appliesTo:
      - 提交后反馈
      - 异步任务完成反馈
    routePattern: /dev/result/<success|fail>
    chooseTemplates:
      - src/pages/templates/dashboard/result-success-page.tsx
      - src/pages/templates/dashboard/result-fail-page.tsx
    buildSteps:
      - 统一 Result 组件表达状态
      - 提供回退动作（返回列表/返回首页/重试）
      - 在触发来源页面补跳转逻辑

  - id: exception-page
    name: 异常页
    appliesTo:
      - 权限拒绝
      - 未找到
      - 服务器异常
    routePattern: /dev/exception/<403|404|500>
    chooseTemplates:
      - src/pages/templates/exception/forbidden-page.tsx
      - src/pages/templates/exception/not-found-page.tsx
      - src/pages/templates/exception/server-error-page.tsx
    buildSteps:
      - 按异常类型渲染模板
      - 保证回到可用路径的引导动作
      - 与路由 fallback 对齐（* -> 404）

decisionTree:
  - if: "需求关键词包含 列表/筛选/分页"
    thenRecipe: list-query-standard
  - if: "需求关键词包含 新建/编辑/详情同构"
    thenRecipe: form-three-mode
  - if: "需求关键词包含 分步/多阶段/步骤条"
    thenRecipe: form-step-standard
  - if: "需求关键词包含 角色管理/权限树/菜单授权"
    thenRecipe: form-three-mode
  - if: "需求关键词包含 查看详情/查看记录，且无特殊展示结构"
    thenRecipe: form-as-detail-default
  - if: "需求关键词包含 提交反馈/结果态"
    thenRecipe: result-feedback-page
  - if: "需求关键词包含 403/404/500/异常"
    thenRecipe: exception-page

qualityGate:
  - 新页面必须在 routes.config.ts 注册
  - 新页面必须声明 permission
  - 有异步请求必须覆盖 empty/error/partial
  - 业务 API contract 必须有类型定义
  - 新增详情需求默认先验证是否可复用 readonly 表单
